<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Toll-Pass 365</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#0b1f4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toll-Pass 365">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-panel">
    <div class="auth-mark">EX</div>
    <h1>Toll-Pass 365</h1>
    <p>사고 보고 시스템</p>
    <form id="loginForm">
      <label for="loginUsername">아이디</label>
      <input id="loginUsername" type="text" autocomplete="username" required>
      <label for="loginPassword">비밀번호</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
      <div id="signupOfficeField" hidden>
        <label for="loginSignupOffice">영업소</label>
        <select id="loginSignupOffice"><option value="">영업소 선택</option></select>
      </div>
      <div class="auth-error" id="loginError" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginButton">로그인</button>
      <button class="auth-toggle" id="authToggle" type="button">회원가입</button>
    </form>
  </div>
</div>
<div class="signup-screen" id="signupScreen">
  <div class="signup-panel">
    <button class="signup-close" id="closeSignup" type="button" aria-label="회원가입 창 닫기">✕</button>
    <div class="auth-mark">EX</div>
    <h2>회원가입</h2>
    <p>영업소별 담당 계정을 신청해주세요.</p>
    <form id="signupForm">
      <label for="signupUsername">아이디</label>
      <input id="signupUsername" type="text" autocomplete="username" required>
      <label for="signupPassword">비밀번호</label>
      <input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required>
      <label for="signupOffice">영업소</label>
      <input id="signupOffice" type="text" placeholder="영업소명을 직접 입력" autocomplete="organization" required>
      <div class="auth-error" id="signupError" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit" id="signupButton">가입 신청</button>
    </form>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 5.5 5.8v5.1c0 5 2.7 8.4 6.5 9.9 3.8-1.5 6.5-4.9 6.5-9.9V5.8L12 3.2Z"/><polyline points="9 12 11 14.2 15.2 9.6"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">Toll-Pass 365</div>
        <div class="brand-sub">사내 전용 · v2.0</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-label">워크스페이스</div>
      <a href="#/dashboard" class="nav-item" data-route="dashboard">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.2V20h12v-9.8"/><path d="M10 20v-5.5h4V20"/></svg></span> 홈
      </a>
      <a href="#/register" class="nav-item" data-route="register">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="3"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="9" y1="12" x2="15" y2="12"/></svg></span> 사고등록
      </a>
      <a href="#/actions" class="nav-item" data-route="actions">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1Z"/><rect x="5.5" y="6" width="13" height="15" rx="2"/><path d="M9 13.2 11 15.2 15.5 10.5"/></svg></span> 조치결과
        <span class="nav-badge" id="navBadge" hidden>0</span>
      </a>
      <a href="#/analytics" class="nav-item" data-route="analytics">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="19" y1="20" x2="19" y2="15"/><line x1="3" y1="20" x2="21" y2="20"/></svg></span> 사고분석
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-avatar">관</div>
      <div class="user-info">
        <div class="user-name">관리자</div>
        <div class="user-role">Administrator</div>
      </div>
      <button class="logout-btn" id="logoutButton" type="button">로그아웃</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <span class="ex-badge">EX</span>
        <div class="breadcrumb" id="breadcrumb">홈 <span class="sep">/</span> <span class="muted">오늘의 현황</span></div>
      </div>
      <div class="topbar-actions">
        <button class="approval-btn" id="approvalButton" type="button" hidden>가입 승인 <span id="approvalCount" hidden>0</span></button>
        <button class="notification-btn" id="enableNotifications" type="button">알림 켜기</button>
        <button class="btn btn-primary" id="openRegisterModal">+ 보고서 등록</button>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>
</div>
<section class="approval-panel" id="approvalPanel" aria-live="polite">
  <div class="approval-box">
    <div class="approval-head"><h2>가입 승인 요청</h2><button type="button" id="closeApprovalPanel">닫기</button></div>
    <div id="approvalList"></div>
  </div>
</section>

<nav class="bottom-nav">
  <button class="bottom-nav-item" data-tab="home" type="button">
    <span class="bn-icon-wrap"><svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.2V20h12v-9.8"/><path d="M10 20v-5.5h4V20"/></svg></span>
    <span class="bn-label">홈</span>
  </button>
  <button class="bottom-nav-item" data-tab="register" type="button">
    <span class="bn-icon-wrap"><svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="3"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="9" y1="12" x2="15" y2="12"/></svg></span>
    <span class="bn-label">사고등록</span>
  </button>
  <button class="bottom-nav-item" data-tab="actions" type="button">
    <span class="bn-icon-wrap">
      <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1Z"/><rect x="5.5" y="6" width="13" height="15" rx="2"/><path d="M9 13.2 11 15.2 15.5 10.5"/></svg>
      <span class="bn-badge" id="navBadgeMobile" hidden>0</span>
    </span>
    <span class="bn-label">조치결과</span>
  </button>
  <button class="bottom-nav-item" data-tab="status" type="button">
    <span class="bn-icon-wrap">
      <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="19" y1="20" x2="19" y2="15"/><line x1="3" y1="20" x2="21" y2="20"/></svg>
    </span>
    <span class="bn-label">사고분석</span>
  </button>
</nav>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="appModal">
    <div class="modal-drag-handle"></div>
    <div class="modal-header">
      <h3 id="appModalTitle">사고 보고서 등록</h3>
      <button class="modal-close" id="closeAppModal">✕</button>
    </div>
    <div class="modal-body" id="appModalBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="drilldownBackdrop">
  <div class="modal" id="drilldownModal">
    <div class="modal-drag-handle"></div>
    <div class="modal-header">
      <h3 id="drilldownTitle">사고 목록</h3>
      <button class="modal-close" id="closeDrilldown">✕</button>
    </div>
    <div class="modal-body" id="drilldownBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
